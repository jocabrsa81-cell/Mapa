<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f1ea">
<title>Mapa de rua</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: #14181c; color: #fff; border-radius: 14px; padding: 8px 14px 6px;
    text-align: center; min-width: 74px; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  #spd { font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #hud small { font-size: 12px; opacity: .75; }
  #chip {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    background: #14181c; color: #fff; font-size: 14px; font-weight: 600; padding: 8px 14px;
    border-radius: 999px; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }
  #chip.on { background: #1a7f37; }
  #info {
    position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    background: rgba(20,24,28,.82); color: #fff; font-size: 12px; padding: 4px 10px;
    border-radius: 14px; max-width: 92vw; text-align: center;
  }
  #rec {
    position: fixed; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: #1a73e8; color: #fff; border: 0; border-radius: 14px; padding: 14px 18px;
    font-size: 16px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  [hidden] { display: none !important; }
  #sv {
    position: fixed; right: 10px; top: calc(100px + env(safe-area-inset-top, 0px));
    background: #14181c; color: #fff; border: 0; border-radius: 12px; padding: 10px 12px;
    font-size: 14px; font-weight: 700;
  }
  #tr {
    position: fixed; right: 10px; top: calc(150px + env(safe-area-inset-top, 0px));
    background: #14181c; color: #fff; border: 0; border-radius: 12px; padding: 10px 12px;
    font-size: 14px; font-weight: 700;
  }
  #tr.on { background: #1a7f37; }
  #pn {
    position: fixed; right: 10px; top: calc(200px + env(safe-area-inset-top, 0px));
    background: #14181c; color: #fff; border-radius: 14px; padding: 12px; width: 220px;
    font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  #pn button { background: #1a73e8; color: #fff; border: 0; border-radius: 10px; padding: 10px; margin: 4px 4px 4px 0; font-size: 14px; font-weight: 700; }
  #pt { margin-top: 6px; opacity: .9; }
  .fdot { width: 18px; height: 18px; pointer-events: none; }
  .fdot i {
    display: block; width: 18px; height: 18px; border-radius: 50%; background: #d62828;
    border: 3px solid #fff; box-sizing: border-box; box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  .fdot b {
    position: absolute; top: 21px; left: 50%; transform: translateX(-50%);
    background: rgba(20,24,28,.85); color: #fff; font: 700 11px system-ui, sans-serif;
    padding: 1px 5px; border-radius: 8px; white-space: nowrap;
  }
  #wx.ok { opacity: .8; font-weight: 600; }
  #wx {
    position: fixed; left: 10px; top: calc(100px + env(safe-area-inset-top, 0px));
    background: #14181c; color: #fff; font-size: 14px; font-weight: 700;
    padding: 9px 12px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .me {
    width: 30px; height: 30px; background: #1a73e8;
    clip-path: polygon(50% 0, 100% 100%, 50% 74%, 0 100%);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
  }
  #go {
    position: fixed; left: 10px; top: calc(150px + env(safe-area-inset-top, 0px));
    background: #14181c; color: #fff; border: 0; border-radius: 12px; padding: 10px 12px;
    font-size: 14px; font-weight: 700; box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  #sp {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10; background: #14181c; color: #fff;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  #sp .lin { display: flex; gap: 8px; }
  #sq { flex: 1; min-width: 0; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 0; background: #fff; color: #14181c; }
  #sp button { background: #1a73e8; color: #fff; border: 0; border-radius: 10px; padding: 0 14px; font-size: 15px; font-weight: 700; }
  #sp button.x { background: #3a4048; }
  #sr { margin-top: 8px; max-height: 52vh; overflow-y: auto; }
  #sr .it { padding: 10px 6px; border-top: 1px solid #2c3238; font-size: 15px; }
  #sr .av { color: #ffb84d; font-size: 12px; margin-top: 2px; }
  #sr .ok { color: #7bd88f; font-size: 12px; margin-top: 2px; }
  #sr .msg { padding: 10px 6px; font-size: 14px; opacity: .85; }
  #rb {
    position: fixed; left: 12px; right: 12px; bottom: calc(94px + env(safe-area-inset-bottom, 0px)); z-index: 5;
    background: #14181c; color: #fff; border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  #rbt { font-size: 17px; font-weight: 800; }
  #rbn { font-size: 12px; opacity: .8; margin-top: 2px; }
  #rbp { font-size: 13px; margin-top: 4px; color: #9cc3ff; }
  #rb button { background: #1a73e8; color: #fff; border: 0; border-radius: 10px; padding: 9px 14px; margin: 8px 8px 0 0; font-size: 14px; font-weight: 700; }
  #rb button.x { background: #b3261e; }
  .dst { font-size: 30px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud"><div id="spd">0</div><small>km/h</small></div>
<div id="chip">A aguardar GPS…</div>
<div id="info" hidden></div>
<div id="wx" hidden></div>
<button id="rec" hidden>Centrar</button>
<button id="sv">Guardar zona</button>
<button id="tr">Trânsito</button>
<button id="go">Destino</button>
<div id="sp" hidden>
  <div class="lin"><input id="sq" type="search" placeholder="Rua, número, localidade" autocomplete="off" enterkeyhint="search"><button id="sb">Procurar</button><button class="x" id="sx">X</button></div>
  <div id="sr"></div>
</div>
<div id="rb" hidden>
  <div id="rbt"></div><div id="rbn" hidden></div><div id="rbp" hidden></div>
  <div><button id="rbP">P perto do destino</button><button class="x" id="rbX">Parar</button></div>
</div>
<div id="pn" hidden>
  Guarda o mapa à volta do centro do ecrã, para usar com sinal fraco. Usa wifi.
  <div>
    <button data-km="5">5 km</button><button data-km="10">10 km</button><button data-km="25">25 km</button>
  </div>
  <div id="pt"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const LIMIT = 50;  // km/h: abaixo disto os números aparecem
const BACK = 55;   // km/h: só desaparecem acima disto (evita piscar)

const spd = document.getElementById('spd');
const chip = document.getElementById('chip');
const rec = document.getElementById('rec');

let follow = true, numsOn = false, bearing = 0, last = null, ready = false;
var busy = false, lastFail = 0, lastFetch = null;

// trânsito em tempo real (TomTom): precisa de rede e não é guardado no telemóvel
const KEY_TT = 'vKk6oa9UQ0WvDI9KYPST3Qq0VAdXguvI';
const trBtn = document.getElementById('tr');
let trOn = false, trErr = 0;
try { trOn = localStorage.getItem('tr') === '1'; } catch (e) {}
const trUrl = () => 'https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=' + KEY_TT +
  '&tileSize=256&t=' + Math.floor(Date.now() / 120000);

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [6.08, 49.48], zoom: 15,
  attributionControl: { compact: true }
});
map.touchZoomRotate.disableRotation();
map.dragRotate.disable();

const dot = document.createElement('div');
dot.className = 'me';
const me = new maplibregl.Marker({ element: dot, rotationAlignment: 'viewport', pitchAlignment: 'viewport' });

map.on('load', () => {
  // esconde os números de porta do estilo base; uso uma camada própria
  map.getStyle().layers
    .filter(l => l['source-layer'] === 'housenumber')
    .forEach(l => map.setLayoutProperty(l.id, 'visibility', 'none'));

  map.addLayer({
    id: 'nums', type: 'symbol', source: 'openmaptiles', 'source-layer': 'housenumber', minzoom: 16,
    layout: {
      'text-field': ['get', 'housenumber'],
      'text-font': ['Noto Sans Bold'],
      'text-size': ['interpolate', ['linear'], ['zoom'], 16, 12, 19, 18],
      'text-allow-overlap': false,
      visibility: 'none'
    },
    paint: { 'text-color': '#7a1f00', 'text-halo-color': '#fff', 'text-halo-width': 2 }
  });

  // carregador elétrico = classe ou subclasse "charging_station"
  const isEV = ['any',
    ['==', ['get', 'class'], 'charging_station'],
    ['==', ['get', 'subclass'], 'charging_station']];
  // bombas de combustível vêm do Overpass (edifício a vermelho); dos tiles só parking e carregadores
  // WC públicos
  const isWC = ['any',
    ['==', ['get', 'class'], 'toilets'],
    ['==', ['get', 'subclass'], 'toilets']];
  const poiFilter = ['any', ['==', ['get', 'class'], 'parking'], isEV, isWC];
  // ao afastar o zoom (12 a 15) mantém-se um ponto laranja simples para as bombas
  map.addLayer({
    id: 'poi-fuel-far', type: 'circle', source: 'openmaptiles', 'source-layer': 'poi', minzoom: 12,
    filter: ['all', ['==', ['get', 'class'], 'fuel'], ['!', isEV]],
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 12, 4, 18, 10],
      'circle-color': '#d62828', 'circle-stroke-width': 1.5, 'circle-stroke-color': '#fff'
    }
  });
  map.addLayer({
    id: 'poi-pontos', type: 'circle', source: 'openmaptiles', 'source-layer': 'poi', minzoom: 13,
    filter: poiFilter,
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 5, 18, 11],
      'circle-color': ['case', isEV, '#1a9850', isWC, '#f08c00', ['==', ['get', 'class'], 'fuel'], '#d62828', '#1c6dd0'],
      'circle-stroke-width': 2, 'circle-stroke-color': '#fff'
    }
  });
  map.addLayer({
    id: 'poi-letra', type: 'symbol', source: 'openmaptiles', 'source-layer': 'poi', minzoom: 15,
    filter: poiFilter,
    layout: {
      'text-field': ['case', isEV, 'E', isWC, 'WC', ['==', ['get', 'class'], 'fuel'], 'G', 'P'],
      'text-font': ['Noto Sans Bold'], 'text-size': ['case', isWC, 10, 12], 'text-allow-overlap': true
    },
    paint: { 'text-color': '#fff' }
  });

  // bombas de combustível: área inteira a vermelho com G branco; ponto vermelho se só houver um ponto
  map.addSource('fuel', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'fuel-area', type: 'fill', source: 'fuel', minzoom: 15,
    filter: ['==', ['geometry-type'], 'Polygon'],
    paint: { 'fill-color': '#d62828', 'fill-opacity': 0.88 }
  }, 'poi-pontos');
  map.addLayer({
    id: 'fuel-borda', type: 'line', source: 'fuel', minzoom: 15,
    filter: ['==', ['geometry-type'], 'Polygon'],
    paint: { 'line-color': '#8d0801', 'line-width': 2 }
  }, 'poi-pontos');
  map.addLayer({
    id: 'fuel-ponto', type: 'circle', source: 'fuel', minzoom: 15,
    filter: ['==', ['geometry-type'], 'Point'],
    paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 15, 6, 18, 12],
      'circle-color': '#d62828', 'circle-stroke-width': 2, 'circle-stroke-color': '#fff'
    }
  });
  map.addLayer({
    id: 'fuel-g', type: 'symbol', source: 'fuel', minzoom: 15,
    layout: { 'text-field': 'G', 'text-font': ['Noto Sans Bold'], 'text-size': ['interpolate', ['linear'], ['zoom'], 15, 13, 18, 20], 'text-allow-overlap': true },
    paint: { 'text-color': '#fff' }
  });

  // trânsito: estradas coloridas por baixo dos nomes das ruas
  map.addSource('trafego', { type: 'raster', tiles: [trUrl()], tileSize: 256, maxzoom: 18, attribution: 'Trânsito © TomTom' });
  const etiqueta = map.getStyle().layers.find(l => l.type === 'symbol');
  map.addLayer({
    id: 'trafego', type: 'raster', source: 'trafego',
    layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.85 }
  }, etiqueta ? etiqueta.id : undefined);

  // incidentes (acidentes, obras, estradas cortadas): só com o botão Trânsito ligado
  criaIconesInc();
  map.addSource('inc', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: 'inc-lin', type: 'line', source: 'inc', minzoom: 9,
    filter: ['==', ['geometry-type'], 'LineString'], layout: { visibility: 'none' },
    paint: {
      'line-color': ['match', ['get', 'cat'], 8, '#d62828', 1, '#d62828', 7, '#f08c00', 9, '#f08c00', '#e0a800'],
      'line-width': ['interpolate', ['linear'], ['zoom'], 9, 2, 16, 6], 'line-opacity': 0.9
    }
  }, etiqueta ? etiqueta.id : undefined);
  map.addLayer({
    id: 'inc-icon', type: 'symbol', source: 'inc', minzoom: 9,
    filter: ['==', ['geometry-type'], 'Point'],
    layout: {
      visibility: 'none', 'icon-image': ['get', 'img'],
      // sem empilhar: onde dois símbolos se sobrepõem, fica o mais grave (acidente, estrada cortada, faixa, obras)
      'icon-allow-overlap': false, 'icon-padding': 3,
      'symbol-sort-key': ['match', ['get', 'cat'], 1, 0, 8, 1, 7, 2, 9, 3, 4],
      'icon-size': ['interpolate', ['linear'], ['zoom'], 9, 0.6, 16, 1]
    }
  });

  // números de porta por cima das áreas das bombas (mas abaixo dos pontos P, E, WC)
  map.moveLayer('nums', 'poi-pontos');

  // rota (por baixo dos números de porta e dos pontos) e ligações aos parques perto do destino
  map.addSource('rota', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'rota-borda', type: 'line', source: 'rota', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#fff', 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 6, 17, 14], 'line-opacity': 0.95 } }, 'nums');
  map.addLayer({ id: 'rota-lin', type: 'line', source: 'rota', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#0b57d0', 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 3, 17, 8] } }, 'nums');
  map.addSource('pperto', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'pp-lin', type: 'line', source: 'pperto', filter: ['==', ['geometry-type'], 'LineString'],
    paint: { 'line-color': '#1c6dd0', 'line-width': 3, 'line-dasharray': [2, 2] } });
  map.addLayer({ id: 'pp-txt', type: 'symbol', source: 'pperto', filter: ['==', ['geometry-type'], 'Point'],
    layout: { 'text-field': ['get', 'txt'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-offset': [0, -1.6], 'text-allow-overlap': true },
    paint: { 'text-color': '#0b3d91', 'text-halo-color': '#fff', 'text-halo-width': 2 } });

  ready = true;
  if (last) apply(last);
  loadPark();
  setTrafego(trOn);
});

const info = document.getElementById('info');

let lastErr = '';
const MIRRORS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
];
async function overpass(q) {
  const ctls = [], errs = [];
  const tries = MIRRORS.map(async u => {
    const ctl = new AbortController(); ctls.push(ctl);
    const t = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(u + '?data=' + encodeURIComponent(q), { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      errs.push(e.name === 'AbortError' ? 'tempo esgotado' : (e instanceof TypeError ? 'bloqueado/rede' : e.message));
      throw e;
    } finally { clearTimeout(t); }
  });
  try {
    const j = await Promise.any(tries);
    ctls.forEach(c => c.abort()); // o primeiro a responder ganha
    return j;
  } catch (e) {
    lastErr = [...new Set(errs)].join(', ');
    return null;
  }
}

// protege contra erros: nunca deixa a etiqueta presa em "a carregar…"
async function loadPark() {
  const wasBusy = busy;
  try { await loadParkInner(); }
  catch (err) {
    lastFail = Date.now();
    info.hidden = false;
    info.textContent = 'Erro na app: ' + (err && err.message ? err.message : err);
  } finally { if (!wasBusy) busy = false; }
}

// toque num ponto ou linha: mostra o tipo e o nome
const popup = new maplibregl.Popup({ closeButton: false, maxWidth: '240px' });
map.on('click', ev => {
  if (!ready) return;
  const layers = ['inc-icon', 'poi-pontos', 'poi-fuel-far', 'fuel-ponto', 'fuel-area'].filter(id => map.getLayer(id));
  const p = ev.point;
  const f = map.queryRenderedFeatures([[p.x - 16, p.y - 16], [p.x + 16, p.y + 16]], { layers })[0];
  if (!f) { popup.remove(); return; }
  const pr = f.properties || {};
  let tipo = '', nome = pr.name || '';
  if (f.layer.id === 'inc-icon') {
    tipo = INC_NOME[pr.cat] || 'Incidente';
    nome = [pr.desc, (pr.from || pr.to) ? (pr.from + ' → ' + pr.to) : '',
            pr.end ? 'até ' + String(pr.end).slice(0, 16).replace('T', ' ') : ''].filter(Boolean).join(' · ');
  } else if (f.layer.id.startsWith('fuel-')) {
    tipo = 'Bomba de combustível';
  } else if (pr.class === 'parking') {
    tipo = 'Estacionamento';
  } else if (pr.class === 'charging_station' || pr.subclass === 'charging_station') {
    tipo = 'Carregador elétrico';
  } else if (pr.class === 'toilets' || pr.subclass === 'toilets') {
    tipo = 'WC público';
  } else if (pr.class === 'fuel') {
    tipo = 'Bomba de combustível';
  } else {
    tipo = pr.class || 'Ponto';
  }
  const box = document.createElement('div');
  box.style.cssText = 'font:14px system-ui,sans-serif;color:#14181c';
  const t = document.createElement('b'); t.textContent = tipo; box.appendChild(t);
  if (nome) { box.appendChild(document.createElement('br')); box.appendChild(document.createTextNode(nome)); }
  popup.setLngLat(ev.lngLat).setDOMContent(box).addTo(map);
});

// dados.json (opcional): ficheiro exportado do Overpass; se cobrir a zona, não precisa de rede
let localData;
async function getLocal() {
  if (localData !== undefined) return localData;
  try {
    let j = null;
    for (const nome of ['dados.json', 'export.json']) {
      try { const r = await fetch(nome); if (r.ok) { j = await r.json(); break; } } catch (e) {}
    }
    if (!j || !Array.isArray(j.elements)) throw new Error('sem ficheiro');
    let s = 90, w = 180, n = -90, e = -180;
    const eat = (la, lo) => { s = Math.min(s, la); n = Math.max(n, la); w = Math.min(w, lo); e = Math.max(e, lo); };
    j.elements.forEach(el => {
      if (el.lat != null) eat(el.lat, el.lon);
      (el.geometry || []).forEach(g => eat(g.lat, g.lon));
    });
    j.ext = [s, w, n, e];
    localData = j;
  } catch (err) { localData = null; }
  return localData;
}

async function loadParkInner() {
  if (!ready || busy || map.getZoom() < 15) return;
  if (Date.now() - lastFail < 20000) return;
  const c = map.getCenter();
  if (lastFetch && lastFetch.distanceTo(c) < 300) return;
  busy = true;
  info.hidden = false; info.textContent = 'Bombas: a carregar…';
  const s = c.lat - 0.005, n = c.lat + 0.005, w = c.lng - 0.007, e = c.lng + 0.007;
  const b = '(' + s + ',' + w + ',' + n + ',' + e + ')';
  const q = '[out:json][timeout:25];(' +
    'node["amenity"="fuel"]' + b + ';' +
    'way["amenity"="fuel"]' + b + ';' +
    ');out tags geom;';
  const L = await getLocal();
  const inside = !!L && c.lat >= L.ext[0] && c.lat <= L.ext[2] && c.lng >= L.ext[1] && c.lng <= L.ext[3];
  const d = inside ? L : await overpass(q);
  if (d && d.remark) lastErr = 'serviço: ' + String(d.remark).slice(0, 40);
  if (!d || !Array.isArray(d.elements) || (d.remark && !d.elements.length)) {
    lastFail = Date.now();
    info.hidden = false;
    info.textContent = navigator.onLine ? 'Bombas: falhou (' + lastErr + ')'
                                        : 'Sem dados guardados nesta zona';
    map.setLayerZoomRange('poi-fuel-far', 12, 24); // bombas do mapa base voltam a aparecer de perto
  } else {
    const fuelFeats = [];
    d.elements.forEach(el => {
      if (el.tags && el.tags.amenity === 'fuel') {
        if (el.type === 'node') {
          fuelFeats.push({ type: 'Feature', properties: { name: el.tags.name || el.tags.brand || '' }, geometry: { type: 'Point', coordinates: [el.lon, el.lat] } });
        } else if (el.geometry && el.geometry.length > 3) {
          const ring = el.geometry.map(g => [g.lon, g.lat]);
          const f = ring[0], l = ring[ring.length - 1];
          if (f[0] === l[0] && f[1] === l[1]) {
            fuelFeats.push({ type: 'Feature', properties: { name: el.tags.name || el.tags.brand || '' }, geometry: { type: 'Polygon', coordinates: [ring] } });
          }
        }
        return;
      }
    });
    map.getSource('fuel').setData({ type: 'FeatureCollection', features: fuelFeats });
    setFuelPts(fuelFeats);
    map.setLayerZoomRange('poi-fuel-far', 12, 15); // dados bons chegaram: o ponto simples só com zoom afastado
    lastFetch = c;
    info.hidden = true; // tudo bem: esconde a linha de informação
  }
  busy = false;
}
map.on('moveend', loadPark);

function apply(p) {
  const c = p.coords;
  const v = (c.speed != null && !isNaN(c.speed)) ? c.speed * 3.6 : 0;
  spd.textContent = Math.round(v);
  curV = v;

  numsOn = numsOn ? v < BACK : v < LIMIT;
  chip.className = numsOn ? 'on' : '';
  chip.textContent = plTxt || 'A localizar…';

  if (c.heading != null && !isNaN(c.heading) && v > 5) bearing = c.heading;
  const pos = [c.longitude, c.latitude];
  me.setLngLat(pos).addTo(map);
  placeUpdate(pos);
  pickNearest(pos); placeDot();
  routeTick(pos, c.accuracy);

  if (ready) map.setLayoutProperty('nums', 'visibility', numsOn ? 'visible' : 'none');

  if (follow && ready) {
    const h = window.innerHeight;
    map.easeTo({
      center: pos, bearing: bearing, zoom: numsOn ? 17.3 : 15.5,
      padding: { top: Math.round(h * 0.4), bottom: 0, left: 0, right: 0 },
      duration: 900, essential: true
    });
  }
}

function onPos(p) { last = p; apply(p); keepAwake(); fetchWx(); fetchInc(); }

function onErr(e) {
  chip.className = '';
  chip.textContent = e.code === 1 ? 'Ativa a localização para este site' : 'Sem sinal de GPS';
}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
} else {
  chip.textContent = 'Este telemóvel não suporta GPS no browser';
}

map.on('dragstart', () => { follow = false; rec.hidden = false; autoFit = false; });
rec.addEventListener('click', () => { follow = true; rec.hidden = true; if (last) apply(last); });

let lock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !lock) {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    }
  } catch (e) { lock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

// tempo: aviso (chuva, gelo, nevoeiro) e mapa mais escuro com chuva ou nevoeiro
const wx = document.getElementById('wx');
let wxOk = 0, wxTry = 0, wxPos = null;

// limites de temperatura (°C) para os avisos de frio; ajustáveis
const T_GELO = 0, T_RISCO = 3;
function wxInfo(c) {
  const code = c.weather_code, temp = c.temperature_2m, vis = c.visibility, precip = c.precipitation;
  const nev = [45, 48].includes(code) || (vis != null && vis < 1000);
  const chuva = [51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99].includes(code) || precip >= 0.3;
  const filter = nev ? 'brightness(0.82) contrast(1.1)' : chuva ? 'brightness(0.78) saturate(0.9)' : undefined;
  let t = null;
  if ([56, 57, 66, 67].includes(code)) t = '🧊 Chuva gelada';
  else if ([71, 73, 75, 77, 85, 86].includes(code)) t = '❄️ Neve';
  else if (temp != null && temp <= T_GELO) t = '🧊 Gelo provável';
  else if (temp != null && temp <= T_RISCO && (chuva || precip > 0)) t = '🧊 Possível gelo';
  else if (nev) t = '🌫️ Nevoeiro';
  else if (chuva) t = '🌧️ Chuva';
  else if (temp != null && temp <= T_RISCO) t = '🥶 Risco de gelo';
  if (t === '❄️ Neve') return { t }; // neve não escurece o mapa
  if (t) return { t, filter };
  // tempo normal: só a temperatura, discreta, para se ver que a meteorologia está a funcionar
  const dia = c.is_day !== 0;
  return { ok: true, t: code <= 1 ? (dia ? '☀️' : '🌙') : code === 2 ? '⛅' : code === 3 ? '☁️' : '🌡️' };
}

function showWx(o, guardado) {
  const cv = map.getCanvas();
  cv.style.transition = 'filter 1s';
  cv.style.filter = o && o.filter ? o.filter : '';
  if (!o) { wx.hidden = true; return; }
  wx.hidden = false;
  wx.className = o.ok ? 'ok' : '';
  wx.textContent = o.t + (o.temp != null ? ' ' + o.temp.toFixed(1).replace('.', ',') + '°' : '') + (guardado ? ' (guardado)' : '');
}

function wxErro(motivo) {
  // só mostra o erro se ainda não houver nenhum valor recente
  if (wxOk) return;
  wx.hidden = false; wx.className = 'ok';
  wx.textContent = '🌡️ Meteo: ' + motivo;
}

// quando se pede o tempo de novo: passados 5 min, ou se andaste mais de ~4 km (no mínimo 1 min entre pedidos)
const WX_MS = 5 * 60 * 1000, WX_DLAT = 0.04, WX_DLON = 0.06, WX_GAP = 60 * 1000;
async function fetchWx() {
  if (Date.now() - wxTry < WX_GAP) return;
  const lat = last ? last.coords.latitude : map.getCenter().lat;
  const lon = last ? last.coords.longitude : map.getCenter().lng;
  if (wxPos && Date.now() - wxOk < WX_MS && Math.abs(lat - wxPos[0]) < WX_DLAT && Math.abs(lon - wxPos[1]) < WX_DLON) return;
  wxTry = Date.now();
  if (!navigator.onLine) { wxErro('sem rede'); return; }
  // primeiro com a visibilidade; se o serviço a recusar, tenta sem ela
  const LISTAS = ['temperature_2m,precipitation,weather_code,is_day,visibility', 'temperature_2m,precipitation,weather_code,is_day'];
  let c = null, motivo = '';
  for (const v of LISTAS) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(3) + '&longitude=' + lon.toFixed(3) +
        '&current=' + v + '&timezone=auto', { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (!j || !j.current) throw new Error('sem dados');
      c = j.current;
    } catch (e) {
      motivo = e.name === 'AbortError' ? 'tempo esgotado' : (e instanceof TypeError ? 'bloqueado/rede' : e.message);
    }
    clearTimeout(t);
    if (c) break;
  }
  if (!c) { wxErro(motivo); return; }
  const o = wxInfo(c);
  o.temp = c.temperature_2m;
  wxOk = Date.now(); wxPos = [lat, lon];
  showWx(o);
  try { localStorage.setItem('wx', JSON.stringify({ t: wxOk, o })); } catch (e) {}
}

// ao abrir, usa o último valor se tiver menos de 3 horas
try {
  const sv = JSON.parse(localStorage.getItem('wx') || 'null');
  if (sv && Date.now() - sv.t < 3 * 3600 * 1000) showWx(sv.o, true);
} catch (e) {}

// ---- localidade e código postal (na etiqueta de cima) ----
// Nominatim (OpenStreetMap) dá a morada; guarda-se por zonas de ~200 m para funcionar sem rede onde já passaste.
// Sem rede e sem guardado, usa o nome da localidade mais próxima dos mapas carregados, marcado com ≈ (sem código postal).
let plTxt = '', plPos = null, plTry = 0, plBusy = false;
const plCache = new Map();
try { JSON.parse(localStorage.getItem('pl') || '[]').forEach(([k, v]) => plCache.set(k, v)); } catch (e) {}
const plKey = p => Math.round(p[1] / 0.002) + ',' + Math.round(p[0] / 0.003);

function plFormat(a) {
  const nome = a.city || a.town || a.village || a.hamlet || a.municipality || a.suburb || '';
  let cp = String(a.postcode || '').split(';')[0].trim();
  if (!nome && !cp) return '';
  if (cp && a.country_code === 'lu') cp = 'L-' + cp.replace(/^L-?\s*/i, '');
  return (cp ? cp + ' ' : '') + nome;
}

function tilesPlace(pos) {
  if (!ready) return '';
  let best = '', bd = 4000;
  try {
    map.querySourceFeatures('openmaptiles', { sourceLayer: 'place' }).forEach(f => {
      const pr = f.properties || {};
      if (!['city', 'town', 'village', 'hamlet'].includes(pr.class) || !pr.name || f.geometry.type !== 'Point') return;
      const d = geoDist(pos, f.geometry.coordinates);
      if (d < bd) { bd = d; best = pr.name; }
    });
  } catch (e) {}
  return best;
}

// sem valor fiável: se ainda estamos perto do último, mantém-no; senão usa o nome dos mapas (≈) ou diz que não há dados
function plFallback(pos) {
  if (plPos && geoDist(plPos, pos) < 1500) return;
  const f = tilesPlace(pos);
  plTxt = f ? '≈ ' + f : 'Localidade: sem dados';
}

async function placeUpdate(pos) {
  const k = plKey(pos);
  if (plCache.has(k)) { plTxt = plCache.get(k); plPos = pos; return; }
  if (plBusy || Date.now() < plTry) { plFallback(pos); return; }
  plBusy = true; plTry = Date.now() + 15000; // no máximo um pedido de 15 em 15 segundos
  try {
    if (!navigator.onLine) throw new Error('sem rede');
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    let j;
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&lat=' +
        pos[1].toFixed(4) + '&lon=' + pos[0].toFixed(4), { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      j = await r.json();
    } finally { clearTimeout(t); }
    const txt = plFormat((j && j.address) || {});
    if (!txt) throw new Error('sem localidade');
    plCache.set(k, txt);
    while (plCache.size > 300) plCache.delete(plCache.keys().next().value);
    try { localStorage.setItem('pl', JSON.stringify([...plCache])); } catch (e) {}
    plTxt = txt; plPos = pos;
  } catch (e) {
    plTry = Date.now() + 45000; // depois de uma falha, espera mais
    plFallback(pos);
  }
  plBusy = false;
}
// ---- fim da localidade ----

// ponto vermelho: direção da bomba mais próxima (em linha reta)
const RAD = Math.PI / 180;
let fuelPts = [], nearF = null, curPos = null, pickT = 0, fdOn = false;

// bombas.json (opcional): lista grande só das bombas, de uma região larga, para o ponto vermelho
// funcionar em qualquer percurso e sem rede (aceita o JSON do Overpass com "out center")
let bigFuel = [];
(async () => {
  try {
    const r = await fetch('bombas.json');
    if (!r.ok) return;
    const j = await r.json();
    bigFuel = (j.elements || [])
      .map(el => el.type === 'node' ? [el.lon, el.lat] : (el.center ? [el.center.lon, el.center.lat] : null))
      .filter(p => p && isFinite(p[0]) && isFinite(p[1]));
  } catch (e) {}
})();
function setFuelPts(fs) {
  fuelPts = fs.map(f => {
    if (f.geometry.type === 'Point') return f.geometry.coordinates;
    const r = f.geometry.coordinates[0]; let x = 0, y = 0;
    r.forEach(p => { x += p[0]; y += p[1]; });
    return [x / r.length, y / r.length];
  });
}
function geoDist(a, b) {
  const dLat = (b[1] - a[1]) * RAD, dLon = (b[0] - a[0]) * RAD;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * RAD) * Math.cos(b[1] * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(h));
}
function geoBearing(a, b) {
  const f1 = a[1] * RAD, f2 = b[1] * RAD, dl = (b[0] - a[0]) * RAD;
  return (Math.atan2(Math.sin(dl) * Math.cos(f2), Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl)) / RAD + 360) % 360;
}
function pickNearest(pos) {
  curPos = pos;
  if (Date.now() - pickT < 2500) return;
  pickT = Date.now();
  const cand = fuelPts.concat(bigFuel);
  if (ready) {
    try {
      map.querySourceFeatures('openmaptiles', { sourceLayer: 'poi', filter: ['==', ['get', 'class'], 'fuel'] })
        .forEach(f => { if (f.properties.subclass !== 'charging_station' && f.geometry.type === 'Point') cand.push(f.geometry.coordinates); });
    } catch (e) {}
  }
  let best = null, bd = Infinity;
  cand.forEach(p => { const d = geoDist(pos, p); if (d < bd) { bd = d; best = p; } });
  nearF = best ? { p: best, d: bd } : null;
}
const fd = document.createElement('div');
fd.className = 'fdot';
fd.innerHTML = '<i></i><b></b>';
const fdMark = new maplibregl.Marker({ element: fd, pitchAlignment: 'viewport', rotationAlignment: 'viewport' });
const FUEL_MAX = 5000; // metros: o ponto só aparece quando a bomba mais próxima está a 5 km ou menos
function placeDot() {
  if (!nearF || !curPos || nearF.d > FUEL_MAX) { if (fdOn) { fdMark.remove(); fdOn = false; } return; }
  const rel = (geoBearing(curPos, nearF.p) - map.getBearing()) * RAD, R = 48;
  fdMark.setLngLat(curPos).setOffset([R * Math.sin(rel), -R * Math.cos(rel)]);
  if (!fdOn) { fdMark.addTo(map); fdOn = true; }
  const d = nearF.d;
  fd.querySelector('b').textContent = d < 1000 ? Math.round(d / 10) * 10 + ' m' : (d / 1000).toFixed(1).replace('.', ',') + ' km';
}
map.on('rotate', placeDot);

// ---- destino e rota (TomTom) ----
// Pesquisa de morada com número (TomTom; Nominatim se falhar), rota com trânsito e parques perto do destino.
// Precisa de rede para pesquisar e para calcular/recalcular a rota; uma rota já calculada continua no ecrã sem rede.
let curV = 0, dest = null, route = null, routeT = 0, routeBusy = false, offCnt = 0, progT = 0, autoFit = false, destMark = null;
const goBtn = document.getElementById('go'), spEl = document.getElementById('sp'), sqEl = document.getElementById('sq');
const srEl = document.getElementById('sr'), rbEl = document.getElementById('rb'), rbt = document.getElementById('rbt');
const rbn = document.getElementById('rbn'), rbp = document.getElementById('rbp');

const fmtKm = m => m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km';
const fmtMin = s => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };
const fmtHora = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

function avisa(txt) {
  info.hidden = false; info.textContent = txt;
  setTimeout(() => { if (info.textContent === txt) info.hidden = true; }, 5000);
}

function abrePesquisa() {
  if (curV > 10) { avisa('Pára o carro para escolher o destino'); return; }
  spEl.hidden = false; sqEl.focus();
}
goBtn.addEventListener('click', abrePesquisa);
document.getElementById('sx').addEventListener('click', () => { spEl.hidden = true; });
document.getElementById('sb').addEventListener('click', pesquisa);
sqEl.addEventListener('keydown', e => { if (e.key === 'Enter') pesquisa(); });

async function pedido(url) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error(r.status === 429 ? 'limite diário atingido' : 'HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

// devolve uma lista { nome, lat, lon, exato, aviso }; "exato" = a TomTom/OSM tem mesmo esse número de porta
async function geocode(q) {
  const lat = last ? last.coords.latitude : map.getCenter().lat, lon = last ? last.coords.longitude : map.getCenter().lng;
  const querNum = /\d/.test(q);
  try {
    const j = await pedido('https://api.tomtom.com/search/2/geocode/' + encodeURIComponent(q) + '.json?key=' + KEY_TT +
      '&limit=6&language=pt-PT&countrySet=LU,FR,BE,DE,PT,ES&lat=' + lat.toFixed(4) + '&lon=' + lon.toFixed(4));
    const out = [];
    (j.results || []).forEach(x => {
      if (!x.position) return;
      const exato = x.type === 'Point Address' || x.type === 'POI';
      const nome = ((x.poi && x.poi.name) ? x.poi.name + ', ' : '') + ((x.address && x.address.freeformAddress) || '');
      out.push({ nome, lat: x.position.lat, lon: x.position.lon, exato, aviso: querNum && !exato });
    });
    if (out.length) return out;
  } catch (e) {}
  const j = await pedido('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&q=' + encodeURIComponent(q));
  return (j || []).map(x => {
    const exato = !!(x.address && x.address.house_number);
    return { nome: x.display_name, lat: +x.lat, lon: +x.lon, exato, aviso: querNum && !exato };
  });
}

async function pesquisa() {
  const q = sqEl.value.trim();
  if (q.length < 3) return;
  srEl.textContent = '';
  const m = document.createElement('div'); m.className = 'msg'; m.textContent = 'A procurar…'; srEl.appendChild(m);
  if (!navigator.onLine) { m.textContent = 'Sem rede: não dá para pesquisar moradas.'; return; }
  let lista;
  try { lista = await geocode(q); }
  catch (e) { m.textContent = 'Falhou a pesquisa (' + (e.name === 'AbortError' ? 'tempo esgotado' : e.message) + ').'; return; }
  srEl.textContent = '';
  if (!lista.length) { m.textContent = 'Nada encontrado.'; srEl.appendChild(m); return; }
  lista.forEach(it => {
    const d = document.createElement('div'); d.className = 'it';
    d.appendChild(document.createTextNode(it.nome));
    const a = document.createElement('div');
    a.className = it.aviso ? 'av' : 'ok';
    a.textContent = it.aviso ? '⚠ número não encontrado: aponta para a rua' : (it.exato ? 'ponto exato' : 'rua / zona');
    d.appendChild(a);
    d.addEventListener('click', () => defineDestino(it));
    srEl.appendChild(d);
  });
}

function defineDestino(it) {
  dest = { lat: it.lat, lon: it.lon, nome: it.nome, aviso: !!it.aviso };
  spEl.hidden = true; sqEl.blur();
  if (destMark) destMark.remove();
  const el = document.createElement('div'); el.className = 'dst'; el.textContent = '🏁';
  destMark = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([it.lon, it.lat]).addTo(map);
  limpaParques();
  calcRota(true);
}

// toque longo no mapa: escolhe o ponto como destino (só parado)
map.on('contextmenu', e => {
  if (curV > 10) { avisa('Pára o carro para escolher o destino'); return; }
  defineDestino({ nome: 'Ponto escolhido no mapa', lat: e.lngLat.lat, lon: e.lngLat.lng, exato: true, aviso: false });
});

async function calcRota(ajusta) {
  if (!dest || routeBusy) return;
  rbEl.hidden = false;
  if (!navigator.onLine) { if (!route) rbt.textContent = 'Sem rede: não dá para calcular a rota'; return; }
  routeBusy = true;
  if (!route) rbt.textContent = 'A calcular rota…';
  const de = last ? [last.coords.latitude, last.coords.longitude] : [map.getCenter().lat, map.getCenter().lng];
  try {
    const j = await pedido('https://api.tomtom.com/routing/1/calculateRoute/' + de[0].toFixed(5) + ',' + de[1].toFixed(5) + ':' +
      dest.lat.toFixed(5) + ',' + dest.lon.toFixed(5) + '/json?key=' + KEY_TT +
      '&traffic=true&travelMode=car&routeType=fastest&computeTravelTimeFor=all&routeRepresentation=polyline');
    const rt = j.routes && j.routes[0];
    if (!rt) throw new Error('sem rota');
    const pts = [];
    rt.legs.forEach(l => l.points.forEach(p => pts.push([p.longitude, p.latitude])));
    if (pts.length < 2) throw new Error('rota vazia');
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + geoDist(pts[i - 1], pts[i]));
    const sm = rt.summary || {};
    route = { pts, cum, total: cum[cum.length - 1], tempo: sm.travelTimeInSeconds || 0, atraso: sm.trafficDelayInSeconds || 0 };
    routeT = Date.now(); offCnt = 0; progT = 0;
    map.getSource('rota').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: pts } });
    if (ajusta) {
      const b = new maplibregl.LngLatBounds(pts[0], pts[0]);
      pts.forEach(p => b.extend(p));
      follow = false; autoFit = true; rec.hidden = false;
      map.fitBounds(b, { padding: { top: 90, bottom: 260, left: 40, right: 40 }, duration: 800, maxZoom: 16 });
      setTimeout(() => { if (route && autoFit) { autoFit = false; follow = true; rec.hidden = true; if (last) apply(last); } }, 6000);
    }
    mostraRota(route.total);
  } catch (e) {
    if (!route) rbt.textContent = 'Rota falhou (' + (e.name === 'AbortError' ? 'tempo esgotado' : e.message) + ')';
    else avisa('Não consegui atualizar a rota (' + (e.name === 'AbortError' ? 'tempo esgotado' : e.message) + ')');
  }
  routeBusy = false;
}

// mostra tempo, distância e hora de chegada; "rest" = metros que faltam
function mostraRota(rest) {
  if (!route) return;
  const seg = route.total > 0 ? route.tempo * rest / route.total : 0;
  rbt.textContent = fmtHora(Date.now() + seg * 1000) + ' · ' + fmtMin(seg) + ' · ' + fmtKm(rest);
  const n = [];
  if (route.atraso >= 120) n.push('+' + fmtMin(route.atraso) + ' por trânsito');
  if (dest && dest.aviso) n.push('⚠ número não encontrado, destino na rua');
  rbn.hidden = !n.length; rbn.textContent = n.join(' · ');
}

function segDist(p, a, b) {
  const kx = Math.cos(p[1] * RAD) * 111320, ky = 110540;
  const px = (p[0] - a[0]) * kx, py = (p[1] - a[1]) * ky, bx = (b[0] - a[0]) * kx, by = (b[1] - a[1]) * ky;
  const L = bx * bx + by * by;
  let t = L ? (px * bx + py * by) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return { d: Math.hypot(px - t * bx, py - t * by), t };
}

// a cada posição (no máximo 1 vez por segundo): progresso, fora de rota, chegada
function routeTick(pos, acc) {
  if (!route || Date.now() - progT < 1000) return;
  progT = Date.now();
  let best = Infinity, bi = 0, bt = 0;
  for (let i = 0; i < route.pts.length - 1; i++) {
    const r = segDist(pos, route.pts[i], route.pts[i + 1]);
    if (r.d < best) { best = r.d; bi = i; bt = r.t; }
  }
  const rest = Math.max(0, route.total - (route.cum[bi] + bt * (route.cum[bi + 1] - route.cum[bi])));
  if (rest < 40 && geoDist(pos, [dest.lon, dest.lat]) < 60) {
    rbt.textContent = 'Chegaste ao destino'; rbn.hidden = true;
    return;
  }
  mostraRota(rest);
  const lim = Math.max(60, (acc || 0) * 1.5);
  offCnt = best > lim ? offCnt + 1 : 0;
  if (offCnt >= 3 && Date.now() - routeT > 15000) { offCnt = 0; calcRota(false); return; }
  if (Date.now() - routeT > 5 * 60 * 1000 && navigator.onLine) calcRota(false); // atualiza o trânsito de 5 em 5 min
}

function limpaParques() {
  rbp.hidden = true; rbp.textContent = '';
  if (ready && map.getSource('pperto')) map.getSource('pperto').setData({ type: 'FeatureCollection', features: [] });
}

// parques (P) mais perto do destino, entre os que o mapa tem carregados
function parquesPerto() {
  if (!dest) return;
  follow = false; autoFit = false; rec.hidden = false;
  map.jumpTo({ center: [dest.lon, dest.lat], zoom: 16, bearing: 0, padding: { top: 0, bottom: 120, left: 0, right: 0 } });
  rbp.hidden = false; rbp.textContent = 'P perto do destino: a procurar…';
  map.once('idle', () => {
    const d0 = [dest.lon, dest.lat], vistos = new Set(), lista = [];
    try {
      map.querySourceFeatures('openmaptiles', { sourceLayer: 'poi', filter: ['==', ['get', 'class'], 'parking'] }).forEach(f => {
        if (f.geometry.type !== 'Point') return;
        const c = f.geometry.coordinates, k = c[0].toFixed(5) + ',' + c[1].toFixed(5);
        if (vistos.has(k)) return;
        vistos.add(k);
        const d = geoDist(d0, c);
        if (d < 700) lista.push({ c, d });
      });
    } catch (e) {}
    lista.sort((a, b) => a.d - b.d);
    const top = lista.slice(0, 3), feats = [];
    top.forEach(x => {
      feats.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [d0, x.c] } });
      feats.push({ type: 'Feature', properties: { txt: fmtKm(x.d) }, geometry: { type: 'Point', coordinates: x.c } });
    });
    map.getSource('pperto').setData({ type: 'FeatureCollection', features: feats });
    rbp.textContent = top.length ? 'P perto do destino: ' + top.map(x => fmtKm(x.d)).join(' · ') + ' (em linha reta)'
                                 : 'Sem parques nos mapas carregados a menos de 700 m do destino';
  });
}

document.getElementById('rbP').addEventListener('click', parquesPerto);
document.getElementById('rbX').addEventListener('click', () => {
  route = null; dest = null; autoFit = false;
  if (destMark) { destMark.remove(); destMark = null; }
  if (ready) map.getSource('rota').setData({ type: 'FeatureCollection', features: [] });
  limpaParques();
  rbEl.hidden = true;
  follow = true; rec.hidden = true; if (last) apply(last);
});
// ---- fim do destino e rota ----

// incidentes de trânsito (TomTom): acidentes, obras, estradas cortadas
const INC_NOME = { 0: 'Incidente', 1: 'Acidente', 2: 'Nevoeiro', 3: 'Condições perigosas', 4: 'Chuva forte', 5: 'Gelo',
  7: 'Faixa cortada', 8: 'Estrada cortada', 9: 'Obras', 10: 'Vento forte', 11: 'Inundação', 14: 'Veículo avariado' };
let incOk = 0, incTry = 0, incPos = null;

function mkIcon(nome, fn) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  fn(x);
  map.addImage(nome, x.getImageData(0, 0, 64, 64), { pixelRatio: 2 });
}
function disco(x, cor) {
  x.beginPath(); x.arc(32, 32, 28, 0, Math.PI * 2);
  x.fillStyle = cor; x.fill();
  x.lineWidth = 4; x.strokeStyle = '#fff'; x.stroke();
  x.textAlign = 'center'; x.textBaseline = 'middle';
}
function criaIconesInc() {
  mkIcon('inc-acc', x => { disco(x, '#d62828'); x.fillStyle = '#fff'; x.font = 'bold 38px sans-serif'; x.fillText('!', 32, 35); });
  mkIcon('inc-fecha', x => { disco(x, '#d62828'); x.fillStyle = '#fff'; x.fillRect(14, 27, 36, 10); });
  mkIcon('inc-faixa', x => { disco(x, '#f08c00'); x.fillStyle = '#fff'; x.fillRect(14, 27, 36, 10); });
  mkIcon('inc-obras', x => { disco(x, '#f08c00'); x.font = '32px sans-serif'; x.fillText('🚧', 32, 35); });
  mkIcon('inc-outro', x => { disco(x, '#e0a800'); x.fillStyle = '#14181c'; x.font = 'bold 38px sans-serif'; x.fillText('!', 32, 35); });
}

async function fetchInc() {
  if (!trOn || !ready) return;
  if (Date.now() - incTry < 120000) return;
  const lat = last ? last.coords.latitude : map.getCenter().lat;
  const lon = last ? last.coords.longitude : map.getCenter().lng;
  if (incPos && Date.now() - incOk < 300000 && Math.abs(lat - incPos[0]) < 0.06 && Math.abs(lon - incPos[1]) < 0.09) return;
  incTry = Date.now();
  const bbox = [lon - 0.18, lat - 0.12, lon + 0.18, lat + 0.12].map(v => v.toFixed(4)).join(',');
  const fields = '{incidents{type,geometry{type,coordinates},properties{iconCategory,magnitudeOfDelay,events{description,code,iconCategory},startTime,endTime,from,to,length}}}';
  let j = null;
  for (const lang of ['pt-PT', 'en-GB']) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 10000);
    try {
      const r = await fetch('https://api.tomtom.com/traffic/services/5/incidentDetails?key=' + KEY_TT +
        '&bbox=' + bbox + '&fields=' + encodeURIComponent(fields) + '&language=' + lang + '&timeValidityFilter=present', { signal: ctl.signal });
      if (r.ok) { j = await r.json(); clearTimeout(t); break; }
    } catch (e) {}
    clearTimeout(t);
  }
  if (!j) return;
  const feats = [];
  (j.incidents || []).forEach(it => {
    const p = it.properties || {}, cat = p.iconCategory, g = it.geometry;
    if (cat === 6 || !g) return; // trânsito lento já se vê nas cores das estradas
    const ev = (p.events && p.events[0]) || {};
    const base = {
      cat: cat, desc: ev.description || '', from: p.from || '', to: p.to || '', end: p.endTime || '',
      img: cat === 1 ? 'inc-acc' : cat === 8 ? 'inc-fecha' : cat === 7 ? 'inc-faixa' : cat === 9 ? 'inc-obras' : 'inc-outro'
    };
    let pt;
    if (g.type === 'Point') pt = g.coordinates;
    else if (g.type === 'LineString' && g.coordinates.length) {
      pt = g.coordinates[Math.floor(g.coordinates.length / 2)];
      feats.push({ type: 'Feature', properties: base, geometry: { type: 'LineString', coordinates: g.coordinates } });
    } else return;
    feats.push({ type: 'Feature', properties: base, geometry: { type: 'Point', coordinates: pt } });
  });
  map.getSource('inc').setData({ type: 'FeatureCollection', features: feats });
  incOk = Date.now(); incPos = [lat, lon];
}

// botão do trânsito
function setTrafego(on) {
  trOn = on;
  trBtn.classList.toggle('on', on);
  try { localStorage.setItem('tr', on ? '1' : '0'); } catch (e) {}
  if (ready) {
    map.setLayoutProperty('trafego', 'visibility', on ? 'visible' : 'none');
    ['inc-lin', 'inc-icon'].forEach(id => map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
  }
  if (on) fetchInc();
}
trBtn.addEventListener('click', () => setTrafego(!trOn));
// de 2 em 2 minutos pede mosaicos novos
setInterval(() => {
  if (trOn && ready && navigator.onLine) { try { map.getSource('trafego').setTiles([trUrl()]); } catch (e) {} fetchInc(); }
}, 120000);
map.on('error', e => {
  if (e && e.sourceId === 'trafego' && trOn && Date.now() - trErr > 30000) {
    trErr = Date.now();
    info.hidden = false;
    info.textContent = navigator.onLine ? 'Trânsito: sem dados aqui' : 'Trânsito: sem rede';
    setTimeout(() => { if (info.textContent.startsWith('Trânsito')) info.hidden = true; }, 6000);
  }
});

// instalação e cache: a app e o mapa já vistos abrem mesmo com sinal fraco
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// guardar zona: descarrega os mosaicos à volta do centro do ecrã
const sv = document.getElementById('sv'), pn = document.getElementById('pn'), pt = document.getElementById('pt');
sv.addEventListener('click', () => { pn.hidden = !pn.hidden; });
pn.querySelectorAll('button[data-km]').forEach(b => b.addEventListener('click', () => saveZone(+b.dataset.km)));

function tileXY(lon, lat, z) {
  const n = 2 ** z, r = lat * Math.PI / 180;
  return [Math.floor((lon + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)];
}

let saving = false;
async function saveZone(km) {
  if (saving) return;
  const src = map.getSource('openmaptiles');
  if (!src || !src.tiles || !('caches' in window)) { pt.textContent = 'Não disponível neste browser.'; return; }
  const tpl = src.tiles[0], maxz = Math.min(14, src.maxzoom || 14);
  const c = map.getCenter();
  const dLat = km / 111, dLon = km / (111 * Math.cos(c.lat * Math.PI / 180));
  const urls = [];
  for (let z = 5; z <= maxz; z++) {
    const [x0, y1] = tileXY(c.lng - dLon, c.lat - dLat, z);
    const [x1, y0] = tileXY(c.lng + dLon, c.lat + dLat, z);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++)
      urls.push(tpl.replace('{z}', z).replace('{x}', x).replace('{y}', y));
  }
  if (urls.length > 4000) { pt.textContent = 'Zona demasiado grande (' + urls.length + ' mosaicos).'; return; }
  saving = true;
  const cache = await caches.open('mapa-dados');
  let done = 0, fail = 0, i = 0;
  pt.textContent = 'A guardar 0/' + urls.length;
  async function worker() {
    while (i < urls.length) {
      const u = urls[i++];
      try {
        if (!(await cache.match(u))) {
          const r = await fetch(u);
          if (r.ok) await cache.put(u, r); else fail++;
        }
      } catch (e) { fail++; }
      done++;
      if (done % 10 === 0 || done === urls.length) pt.textContent = 'A guardar ' + done + '/' + urls.length;
    }
  }
  await Promise.all(Array.from({ length: 6 }, worker));
  saving = false;
  pt.textContent = fail ? 'Guardado, mas ' + fail + ' mosaicos falharam. Repete com boa rede.'
                        : 'Zona guardada (' + urls.length + ' mosaicos).';
}
